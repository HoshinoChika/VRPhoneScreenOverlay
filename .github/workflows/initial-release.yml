name: Update release description
on:
  push:
    branches: [main]
    paths: [docs/RELEASE_NOTES.md, .github/workflows/initial-release.yml]
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v0.2.7 --notes-file docs/RELEASE_NOTES.md
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.2.7" --jq '{body: .body, url: .html_url}' > release-text-status.json
          content="$(base64 -w0 release-text-status.json)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/.github/release-text-status.json" -f message="Record release description" -f content="$content"
